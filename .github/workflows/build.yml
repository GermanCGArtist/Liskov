name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure short unix domain tmpdir on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p C:/tmp
          echo "JAVA_TOOL_OPTIONS=-Djdk.net.unixdomain.tmpdir=C:/tmp" >> "$GITHUB_ENV"
      - name: Build and test
        shell: bash
        run: ./gradlew test build --stacktrace
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: liskov-jar
          path: |
            liskov-ui/build/libs/liskov-*.jar
            !liskov-ui/build/libs/*-sources.jar
